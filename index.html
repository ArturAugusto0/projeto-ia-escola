<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto: IA na Escola</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 16px; }
        .btn-container {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #7dd3fc; }
        #resultado {
            margin-top: 20px;
            font-weight: 500;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Refletindo sobre IA na Escola</h1>
    <p id="pergunta">Você usa Inteligência Artificial (como ChatGPT ou a Luri da Alura) para fazer seus trabalhos escolares de forma automática?</p>
    
    <div class="btn-container">
        <button onclick="responder('sim')">SIM</button>
        <button onclick="responder('nao')">NÃO</button>
    </div>

    <p id="resultado"></p>
</div>

<script>
    function responder(escolha) {
        const resultadoTexto = document.getElementById('resultado');
        if (escolha === 'sim') {
            resultadoTexto.innerHTML = "⚠️ <span style='color: #fb7185;'>Reflexão:</span> Usar a IA para fazer tudo por você pode prejudicar seu aprendizado real! Tente usá-la apenas como uma assistente para tirar dúvidas e criar resumos.";
        } else {
            resultadoTexto.innerHTML = "✅ <span style='color: #4ade80;'>Muito bem!</span> O uso consciente ou a preferência por estudar de forma tradicional garante que o seu pensamento crítico e autoral continue se desenvolvendo.";
        }
    }
</script>

</body>
</html>
